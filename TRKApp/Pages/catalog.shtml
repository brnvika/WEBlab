<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ТРК Атриум</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="../styles/aside.css">
    <link rel="stylesheet" href="../styles/catalog.css">
</head>
<body>
<!--#include virtual="../base/header.html" -->
<!--#include virtual="../base/aside.html" -->
<main>
    <div class="catalog">
    <h2>КАТАЛОГ</h2>
        <div class="search-form">
            <div class="search-form__input-group">
                <input id="searchInput" type="text" class="search-form__input" placeholder="Найти магазин">
                <button id="searchButton" class="search-form__button">
                    <img src="../images/icons8-поиск-40.png" alt="Поиск">
                </button>
            </div>
            <select id="selectCategory" class="search-form__select">
                <option value="all">Все магазины</option>
                <option value="clothes">Одежда</option>
                <option value="shoes">Обувь</option>
                <option value="jewelry">Ювелирные изделия</option>
            </select>
            <div class="search-form__sort">
                <select>
                    <option value="alphabet">По алфавиту</option>
                    <option value="popularity">По популярности</option>
                </select>
            </div>
        </div>
    <div class="catalog__grid">
        <section>
            <!-- Карточки магазинов загружаются динамически через JavaScript -->
        </section>
    </div>
    </div>
</main>
<!--#include virtual="../base/footer.html" -->
<script src="../scripts/catalog.js"></script>
</body>
</html>
